# MA-PDDL Planning Configuration

llm:
  provider: groq                        # groq | openai | anthropic | google | ollama | deepseek | azure | huggingface
  model: openai/gpt-oss-120b
  temperature: 0.0
  max_tokens: 8000
  # api_key: null                       # or set via env: GROQ_API_KEY, OPENAI_API_KEY, etc.
  # url: http://localhost:11434         # ollama only

planning:
  strategy: llm-modulo                  # llm-modulo | llm-repair | llm-merge | base
  max_steps: 1000
  compress_pddl: true
  skip_pyperplan: false                 # set true for numeric domains (elevators, etc.)

# Strategy-specific settings — only the active strategy's section is read.

llm-modulo:
  backprompt_max_retries: 2            # 0 = one shot; N = retry with VAL feedback N times
  stop_on_empty_plan: true
  condense_val_errors: true            # compress VAL output before sending to LLM

llm-repair:
  action_validation: repair            # raw | filter | repair
  embed_model: paraphrase-MiniLM-L6-v2

llm-merge:
  {}                                   # no extra params yet

base:
  {}                                   # no extra params

few_shot:
  enabled: false
  count: 0
  examples_file: results/few_shot_examples.json

paths:
  val_bin: null                        # auto-detected from VAL/ directory
  converter_script: null               # auto-detected from codmap-2015/
  python2_cmd: python3

debug:
  enabled: false
  show_prompts: false
  show_llm_output: false
  val_feedback: false
