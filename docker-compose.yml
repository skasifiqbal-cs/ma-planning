services:
  plan:
    build:
      context: .
      args:
        - HTTP_PROXY
        - HTTPS_PROXY
        - NO_PROXY
    env_file:
      - .env
    volumes:
      - ./results:/app/results           # persist experiment outputs on host
      - ./config.yaml:/app/config.yaml   # edit config without rebuilding
      # Optional: mount a larger dataset to override the bundled domains/
      # - /path/to/your/unfactored:/app/domains/unfactored:ro
    # Usage:
    #   docker compose run --rm plan plan --domain-dir domains/unfactored/rovers --problem-file p10 --validate
    #   docker compose run --rm plan experiment --domains rovers logistics00
    #   docker compose run --rm plan analyze
